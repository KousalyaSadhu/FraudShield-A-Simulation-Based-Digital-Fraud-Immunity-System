<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FraudShield</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  

<header class="header">
  <h1>🛡️ FraudShield</h1>
  <p>Train your mind. Stay ahead of scams.</p>
</header>

<section class="banner-image">
  <img src="fraudshieldbanner.png" alt="Fraud Awareness">

</section>

<section class="search-section">
  <div class="search-box">
    <input type="text" id="scenarioInput" placeholder="Describe what happened..."/>
    <button onclick="detectFraud()">Analyze</button>
  </div>
</section>



<div id="resultBox"></div>
<section class="cards-container" id="fraudCards">
  <!-- JS Injects Cards -->
</section>



<!-- HELPLINE SECTION -->
<footer class="helpline-footer">
  <div class="footer-title">
    🚨 Emergency Helplines
  </div>

  <div class="helpline-grid">
    <div class="helpline-card">
      <span>Cyber Fraud Helpline</span>
      <strong>1930</strong>
    </div>

    <div class="helpline-card">
      <span>Police Emergency</span>
      <strong>112</strong>
    </div>

    <div class="helpline-card">
      <span>Women Safety</span>
      <strong>181</strong>
    </div>

        <div class="helpline-card">
      <span>Cyber Crime Portal</span>
      <a href="https://cybercrime.gov.in" target="_blank">
        cybercrime.gov.in
      </a>
    </div>

  </div>



  <div class="footer-warning">
    ⚠ If you are scammed, report immediately. Do not panic.
  </div>
</footer>
<div class="copyright">
  © 2026 FraudShield. All Rights Reserved.
</div>
<script src="script.js"></script>
</body>
</html>
